# Grafana Loki configuration — Issue #284
# Aggregates container logs from backend, indexer, and oracle workers.
# Retention: 14 days with automated pruning (compactor).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Schema: use tsdb index for best performance on structured labels.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  wal:
    enabled: true
    dir: /loki/wal
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 1h
  max_chunk_age: 1h
  chunk_target_size: 1048576
  chunk_retain_period: 30s

querier:
  max_concurrent: 8

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  # Automated 14-day log retention pruning (Acceptance Criteria #3)
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

limits_config:
  # 14-day retention per stream (issue #284 AC)
  retention_period: 336h
  # Allow structured JSON log parsing labels
  max_label_names_per_series: 15
  max_label_value_length: 2048
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB
  # Reject logs older than 1 hour to avoid backfill confusion
  reject_old_samples: true
  reject_old_samples_max_age: 1h

ruler:
  alertmanager_url: http://alertmanager:9093

analytics:
  reporting_enabled: false
