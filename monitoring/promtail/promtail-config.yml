# Promtail configuration — Issue #284
# Scrapes container stdout logs and ships them to Loki with structured labels.
#
# Labels applied to every log stream:
#   service    — container name (api / indexer / oracle / referral / postgres / redis)
#   level      — extracted from JSON "level" field (info / warn / error / debug)
#   market_id  — extracted from JSON "market_id" field when present
#   trace_id   — extracted from JSON "trace_id" field when present (distributed tracing)

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: ipredict
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:

  # ── API service ──────────────────────────────────────────────────────────────
  - job_name: api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ["predictify-api"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: service
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
    pipeline_stages:
      # Parse JSON logs emitted by the Node.js API
      - json:
          expressions:
            level:     level
            message:   msg
            market_id: market_id
            trace_id:  trace_id
      - labels:
          level:
          market_id:
          trace_id:
      - output:
          source: message

  # ── Indexer service ──────────────────────────────────────────────────────────
  - job_name: indexer
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ["predictify-indexer"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: service
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
    pipeline_stages:
      - json:
          expressions:
            level:     level
            message:   msg
            market_id: market_id
            trace_id:  trace_id
      - labels:
          level:
          market_id:
          trace_id:
      - output:
          source: message

  # ── Oracle worker ────────────────────────────────────────────────────────────
  - job_name: oracle
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ["predictify-oracle"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: service
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
    pipeline_stages:
      - json:
          expressions:
            level:     level
            message:   msg
            market_id: market_id
            trace_id:  trace_id
      - labels:
          level:
          market_id:
          trace_id:
      - output:
          source: message

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  - job_name: postgres
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ["predictify-postgres"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: service
    pipeline_stages:
      # Postgres logs are plain text; extract log level from the prefix
      - regex:
          expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+ UTC) \[.*\] (?P<level>[A-Z]+):\s+(?P<message>.*)'
      - labels:
          level:
      - output:
          source: message

  # ── Redis ────────────────────────────────────────────────────────────────────
  - job_name: redis
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: name
            values: ["predictify-redis"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: service
    pipeline_stages:
      - output:
          source: __line__
